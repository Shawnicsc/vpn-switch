name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and repository
        run: ./scripts/validate.sh --tag "${GITHUB_REF_NAME}"

      - name: Package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="vpn-switch-${tag}/" -o "dist/vpn-switch-${tag}.tar.gz" HEAD
          git archive --format=zip --prefix="vpn-switch-${tag}/" -o "dist/vpn-switch-${tag}.zip" HEAD

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* \
            --title "vpn-switch ${tag}" \
            --generate-notes \
            --verify-tag
